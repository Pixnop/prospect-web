# Configuration de l'analyse automatique SonarCloud.
#
# Les deux voix de la landing (src/i18n/landing.ts) sont structurellement
# identiques à dessein : même forme pour chaque bloc, seule la phrase change,
# et c'est cette forme qui garantit la parité des deux langues. Le détecteur
# de copier-coller lit ça comme de la duplication à corriger ; dédupliquer
# deux traductions reviendrait à n'en avoir qu'une. Même arbitrage que le
# launcher pour ses deux tables de traduction (Prospect, PR #39).
sonar.cpd.exclusions=src/i18n/landing.ts
